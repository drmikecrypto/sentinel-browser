[package]
name = "sent-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = { version = "0.29", features = ["rwh_06"] }
raw-window-handle = "0.6"
tracing = "0.1"
anyhow = "1.0"
tokio = { version = "1", features = ["full"] }
wgpu = "28.0.0"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
crossbeam-channel = "0.5.15"
sent-net = { version = "0.1.0", path = "../network" }
sent-gov = { version = "0.1.0", path = "../governance" }
sent-search = { version = "0.1.0", path = "../search" }
glyphon = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
wry = "0.56"
http = "1"
dpi = "0.1"
url = "2.5"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
] }
