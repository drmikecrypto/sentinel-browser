[package]
name = "sent-shield"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
thiserror = "1.0"
pqcrypto-mlkem = "0.1"
pqcrypto-traits = "0.3"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"

[dev-dependencies]
proptest = "1.4"
