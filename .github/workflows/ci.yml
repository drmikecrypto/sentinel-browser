name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-windows:
    name: Windows check + test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check --workspace
        run: cargo check --workspace --all-targets

      - name: cargo test --workspace
        run: cargo test --workspace -- --nocapture

  release-windows:
    name: Windows release binary
    runs-on: windows-latest
    needs: check-windows
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release

      - name: Upload artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-browser-windows-x64
          path: target/release/sentinel-browser.exe
          if-no-files-found: error

      # Set WINDOWS_CERT_PFX (base64 PFX) + WINDOWS_CERT_PASSWORD to enable Authenticode.
      - name: Optional Authenticode sign
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX) {
            Write-Host "No WINDOWS_CERT_PFX secret — skipping sign (unsigned artifact still uploaded)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          & signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 target\release\sentinel-browser.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\sentinel-browser.exe target\release\sentinel-browser-signed.exe

      - name: Upload signed artifact
        if: hashFiles('target/release/sentinel-browser-signed.exe') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-browser-windows-x64-signed
          path: target/release/sentinel-browser-signed.exe
