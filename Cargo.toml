[workspace]
members = [
    "core", "governance",
    "network",
    "search", "security",
    "ui"
]
resolver = "2"

[package]
name = "sentinel-browser"
version = "0.0.2"
edition = "2021"
authors = ["drmikecrypto <drmikecrypto@gmail.com>"]
license = "AGPL-3.0"
description = "A community-controlled, privacy-native web browser."
repository = "https://github.com/drmikecrypto/sentinel-browser"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.21", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
sent-core = { path = "./core" }
sent-ui = { version = "0.1.0", path = "ui" }
crossbeam-channel = "0.5.15"

[dev-dependencies]
proptest = "1.4"
proptest-derive = "0.4"