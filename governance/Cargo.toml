[package]
name = "sent-gov"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
tracing = "0.1"
ark-groth16 = "0.5.0"
ark-serialize = "0.5.0"
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-crypto-primitives = { version = "0.5.0", features = ["snark", "crh", "sponge", "r1cs"] }
ark-snark = "0.5.0"
ark-relations = "0.5.0"
ark-r1cs-std = "0.5.0"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
ark-std = "0.5"
sha3 = "0.10"

[dev-dependencies]
proptest = "1.4"
